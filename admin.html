<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Habibi Party</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B0B3F">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="adm">
<div class="adm-app">
  <aside class="adm-side" id="side" aria-label="Admin navigation">
    <a class="adm-brand" href="admin.html"><img src="assets/img/logo.svg" alt="" width="40" height="38"><span>Habibi <em>Admin</em></span></a>
    <nav class="adm-nav" data-nav>
      <a href="#overview" data-v="overview"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>Overview</a>
      <a href="#orders" data-v="orders"><i class="bi bi-bag-check-fill" aria-hidden="true"></i>Orders<span class="adm-pill" data-count="orders"></span></a>
      <a href="#products" data-v="products"><i class="bi bi-box-seam-fill" aria-hidden="true"></i>Products</a>
      <a href="#customers" data-v="customers"><i class="bi bi-people-fill" aria-hidden="true"></i>Customers</a>
      <a href="#enquiries" data-v="enquiries"><i class="bi bi-chat-heart-fill" aria-hidden="true"></i>Enquiries<span class="adm-pill" data-count="enq"></span></a>
      <a href="#settings" data-v="settings"><i class="bi bi-gear-fill" aria-hidden="true"></i>Settings</a>
    </nav>
    <div class="adm-side-foot">
      <a href="index.html" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>View store</a>
      <p>Demo data. Changes are saved in this browser only.</p>
    </div>
  </aside>
  <div class="adm-scrim" data-scrim></div>
  <div class="adm-main">
    <header class="adm-top">
      <button class="adm-ico adm-menu" type="button" data-menu aria-label="Open menu"><i class="bi bi-list" aria-hidden="true"></i></button>
      <div>
        <h1 class="adm-title" data-title>Overview</h1>
        <p class="adm-date" data-date></p>
      </div>
      <label class="adm-search"><i class="bi bi-search" aria-hidden="true"></i><span class="visually-hidden">Search</span><input type="search" placeholder="Search orders, products, customers" data-gsearch autocomplete="off"></label>
      <div class="adm-me"><span class="adm-avatar">A</span><span class="adm-me-t"><b>Admin</b><small>Store owner</small></span></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="adm-drawer" data-drawer aria-hidden="true"><div class="adm-drawer-bg" data-close></div><aside class="adm-drawer-p" role="dialog" aria-modal="true" aria-label="Details"><button class="adm-ico adm-x" type="button" data-close aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button><div data-drawer-body></div></aside></div>
<div class="adm-toast" role="status" aria-live="polite"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
